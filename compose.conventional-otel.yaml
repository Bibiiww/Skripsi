# Final conventional comparison: OpenTelemetry SDK with BatchSpanProcessor.
services:
  gateway: &otel-service
    environment:
      TRACING_MODE: conventional-otel
      TRACE_COLLECTOR_URL: http://trace-collector:3000
      OTEL_BSP_SCHEDULE_DELAY_MS: ${OTEL_BSP_SCHEDULE_DELAY_MS:-100}
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: ${OTEL_BSP_MAX_EXPORT_BATCH_SIZE:-256}
      TRACE_EXPECTED_CONVENTIONAL_SPANS: 7
  matching: *otel-service
  trace-collector:
    build: .
    environment:
      SERVICE_ROLE: trace-collector
      PORT: 3000
    ports: ["16686:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
