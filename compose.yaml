name: tracing-benchmark

services:
  gateway:
    build: .
    environment:
      SERVICE_ROLE: gateway
      PORT: 3000
      CATALOG_URL: http://catalog:3000
      INVENTORY_URL: http://inventory:3000
    ports:
      - "8080:3000"
    depends_on:
      catalog:
        condition: service_healthy
      inventory:
        condition: service_healthy

  catalog:
    build: .
    environment:
      SERVICE_ROLE: catalog
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory:
    build: .
    environment:
      SERVICE_ROLE: inventory
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
