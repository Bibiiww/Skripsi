name: tracing-benchmark

services:
  gateway:
    build: .
    environment:
      SERVICE_ROLE: gateway
      PORT: 3000
      MATCHING_URL: http://matching:3000
      INTERNAL_OBSERVABILITY: ${INTERNAL_OBSERVABILITY:-false}
    ports:
      - "8080:3000"
    depends_on:
      matching:
        condition: service_healthy

  matching:
    build: .
    environment:
      SERVICE_ROLE: matching
      PORT: 3000
      INTERNAL_OBSERVABILITY: ${INTERNAL_OBSERVABILITY:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test harness only. It is deliberately profile-gated so `compose up` never
  # includes it in System-Under-Test resource sampling. The experiment runner
  # invokes it as a one-shot container on the same Docker network.
  load-generator:
    build: .
    profiles: ["load-generator"]
    working_dir: /app
    volumes:
      - ./results:/results
